for(let i=60;i<n-1;i++){const k=key(i);for(const H of HS){if(i+H>n-1)continue;for(const T of TS){const id=H+'_'+T,w=win(i,H,T),x=all[id]=all[id]||{w:0,n:0},y=by[k+id]=by[k+id]||{w:0,n:0};x.w+=w;x.n++;y.w+=w;y.n++}}}
const k0=key(i0),hz={};for(const H of HS){const o={};for(const T of TS){const id=H+'_'+T,x=all[id]||{w:0,n:0},y=by[k0+id]||{w:0,n:0},base=x.n?x.w/x.n:0,tt=Math.round(T*100);o['p'+tt]=(y.w+10*base)/(y.n+10);o['n'+tt]=y.n}
const U=[],D=[];for(let i=60;i+H<=n-1;i++){let mx=0,mi=1e12;for(let j=i+1;j<=i+H;j++){mx=Math.max(mx,K[j].h);mi=Math.min(mi,K[j].l)}U.push(mx/c[i]-1);D.push(1-mi/c[i])}
o.u50=qs(U,.5);o.u80=qs(U,.8);o.d50=qs(D,.5);o.d80=qs(D,.8);hz[H]=o}
return{p:c[i0],sd:sdf(i0),rsi:r,up:c[i0]>E[i0],sc,hz}}
/* ---------- market list ---------- */
const PX={},MK={res:[],busy:0,prog:'',err:'',up:true},CS={};let last=0;
async function runMarket(){if(MK.busy)return;MK.busy=1;MK.err='';
try{const all=await t24();all.forEach(x=>PX[x.symbol]=+x.lastPrice);last=Date.now();

function card(r){const H=S.h,q=r.hz[H],p=PX[r.s+'USDT']||r.p,sd=Math.min(.12,Math.max(r.sd,q.d80)),sz=Math.min(S.bg*.25,S.bg*S.rk/100/sd)*(q.p5>=.5?1:q.p5>=.3?.7:.5)*(MK.up?1:.5),
pc=v=>(v*100).toFixed(0)+'%',pp=v=>(v*100).toFixed(1)+'%',k=r.sc>=3?'buy':r.sc<=-3?'sell':'hold',cs=q.n5>=30?'#0ecb81':q.n5>=12?'#fcd535':'#f6465d';
return`<div class="card ${k=='buy'?'gb':k=='sell'?'gs':''}"><div class="h"><b>${r.s} / USDT</b><a href="https://www.binance.com/en/trade/${r.s}_USDT?type=spot" target="_blank" rel="noopener">${t('binance')}</a></div>
<div><span class="p">$${f(p)}</span> <span class="sc ${r.chg>=0?'up':'dn'}">${r.chg.toFixed(1)}% ${t('today')}</span></div>
<div class="act ${k} ${k!='hold'&&Math.abs(r.sc)>=4?'blink':''}">${t(k=='buy'?'buy':k=='sell'?'sell':'wait')}</div><div class="sc">${t(k=='buy'?'a_buy':k=='sell'?'a_sell':'a_wait')}</div>
<div style="margin-top:8px"><span class="sc">${t('chance',{h:H})}</span><br><b style="font-size:22px">${pc(q.p5)}</b> <span class="sc">(${q.n5} ${t('cases')}) | +10%: <b>${pc(q.p10)}</b></span><div class="bar2"><i style="width:${Math.min(100,q.p5*100)}%"></i></div></div>
<div class="z"><div>${t('buyzone')}<b class="up">$${f(p*(1-q.d50))} - $${f(p)}</b><span>${t('dip')} -${pp(q.d50)}</span></div><div>${t('stop')}<b class="dn">$${f(p*(1-sd))} (-${pp(sd)})</b><span>${t('nstop')}</span></div>
<div>${t('z1')} (+${pp(q.u50)})<b class="up">$${f(p*(1+q.u50))}</b><span>${t('n50')}</span></div><div>${t('z2')} (+${pp(q.u80)})<b class="up">$${f(p*(1+q.u80))}</b><span>${t('n20')}</span></div></div>
<div class="sc" style="margin-top:8px">${t('inv',{a:sz.toFixed(0),p:(sz/(S.bg||1)*100).toFixed(0),l:(sz*sd).toFixed(0),g1:(sz*q.u50).toFixed(0),g2:(sz*q.u80).toFixed(0)})} ${t('sellby',{x:hrs(Date.now()+H*36e5)})} <span style="color:${cs}">${r.up?t('up'):t('down')}, RSI ${r.rsi.toFixed(0)}</span></div>
<div class="row"><button class="sm" onclick="addCoin('${r.s}')">${t('addmine')}</button></div></div>`}
function renderMarket(){const o=$('#mk');if(!o)return;const H=S.h,L=MK.res.filter(r=>r.hz[H]).sort((a,b)=>b.hz[H].p5-a.hz[H].p5).slice(0,12);
if(!L.length){o.innerHTML=`<div class="todo">${MK.prog||t('loading')}${MK.err?'<br><span class="dn">'+MK.err+'</span>':''}</div>`;return}
o.innerHTML=(MK.prog?`<div class="sc">${MK.prog}</div>`:'')+(MK.err?`<div class="todo dn">${MK.err}</div>`:'')+`<div class="g">${L.map(card).join('')}</div>`;
const s=STL.filter(x=>PX[x+'USDT']).map(x=>{const v=PX[x+'USDT'],d=(v-1)*100,a=Math.abs(d),st=a<=.3?['ok','#0ecb81']:a<=1?['watch','#fcd535']:['depeg','#f6465d'];return`<div>${x}<b style="color:${st[1]}">$${v.toFixed(4)}</b><span>${d>=0?'+':''}${d.toFixed(2)}% - ${t(st[0])}</span></div>`}).join('');

/* ---------- my coins ---------- */
const gc=s=>S.coins.find(c=>c.s==s);
async function addCoin(x){const i=$('#ac'),s=(typeof x=='string'?x:i.value).toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/USDT$/,'');if(!s||gc(s))return;S.coins.push({s,e:[]});i.value='';save();fillSel();renderCoins();loadCoin(s);tab('c')}

function de(s,i){gc(s).e.splice(i,1);save();renderCoins()}
function rm(s){S.coins=S.coins.filter(c=>c.s!=s);save();fillSel();renderCoins()}
function sd(s,i){const n=+prompt(t('sp1'));if(n>0){const x=gc(s).e[i];x.sold=n;save();renderCoins()}}
function sp(s){const c=gc(s),pr=+prompt(t('sp1'));if(!(pr>0))return;const rec=+prompt(t('sp2'));if(!(rec>0))return;let rem=rec/pr;const tot=c.e.filter(x=>!x.sold).reduce((a,x)=>a+x.u/x.p,0);if(rem>tot*1.0001){alert(t('sp3'));return}
const ne=[];c.e.forEach(x=>{if(x.sold||rem<=1e-12){ne.push(x);return}const eq=x.u/x.p,k=Math.min(eq,rem);rem-=k;ne.push({p:x.p,u:k*x.p,sold:pr});if(eq-k>1e-9)ne.push({p:x.p,u:(eq-k)*x.p})});c.e=ne;save();renderCoins()}
async function loadCoin(s){try{CS[s]=analyse(await kl(s))}catch(e){}renderCoins()}
function beep(){try{const a=new(window.AudioContext||webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();a.close()},300)}catch(e){}}
function notify(a,b){beep();if(window.Notification&&Notification.permission=='granted'){try{new Notification(a,{body:b})}catch(e){}}}
function enNotif(){if(window.Notification)Notification.requestPermission()}
function renderCoins(){const o=$('#cl');if(!o)return;if(!S.coins.length){o.innerHTML=`<div class="todo">${t('nocoins')}</div>`;return}
o.innerHTML='<div class="g">'+S.coins.map(c=>{const p=PX[c.s+'USDT'],op=c.e.filter(x=>!x.sold),inv=op.reduce((a,x)=>a+x.u,0),q=op.reduce((a,x)=>a+x.u/x.p,0),avg=q?inv/q:0,real=c.e.filter(x=>x.sold).reduce((a,x)=>a+x.u/x.p*(x.sold-x.p),0),a=CS[c.s],sg=a?(a.sc>=3?'buy':a.sc<=-3?'sell':'hold'):'hold';
const rows=c.e.map((x,i)=>{const qq=x.u/x.p,del=`<i style="cursor:pointer;color:var(--r)" onclick="de('${c.s}',${i})">✕</i>`;
if(x.sold){const rp=qq*(x.sold-x.p);return`<tr style="color:var(--m)"><td>#${i+1}</td><td>$${f(x.p)}</td><td>$${+x.u.toFixed(2)}</td><td colspan="2" class="${rp>=0?'up':'dn'}">${t('sold')} @ $${f(x.sold)}: ${rp>=0?'+':''}${rp.toFixed(2)}$</td><td>${del}</td></tr>`}
const tg=x.p*(1+S.tp/100),pl=p?qq*p-x.u:0,hit=p&&p>=tg;if(hit&&!x.n){x.n=1;save();notify(c.s,t('tgthit'))}
return`<tr><td>#${i+1}</td><td>$${f(x.p)}</td><td>$${+x.u.toFixed(2)}</td><td class="${pl>=0?'up':'dn'}">${pl>=0?'+':''}${pl.toFixed(2)}$ (${(pl/x.u*100).toFixed(1)}%)</td><td>$${f(tg)}</td><td>${hit?`<span class="blink up"><b>${t('hit')}</b></span>`:t('hold')} <button class="sm" onclick="sd('${c.s}',${i})">${t('sold')}</button> ${del}</td></tr>`}).join('');
let sum='';if(q){const tg=avg*(1+S.tp/100),sl=avg*(1-S.sl/100),pl=p?p*q-inv:0;let A=t('waiting'),ac='hold';if(p){if(p>=tg){A=t('tgthit');ac='buy blink'}else if(p<=sl){A=t('stophit');ac='sell blink';if(!c.sn){c.sn=1;save();notify(c.s,A)}}}
sum=`<div class="todo"><b>${t('avg')}: $${f(avg)}</b> | ${t('coins')}: ${q.toFixed(4)} | ${t('invested')}: $${inv.toFixed(2)}<br><span class="${pl>=0?'up':'dn'}">${t('pl')}: <b>${pl>=0?'+':''}${pl.toFixed(2)}$ (${p?(pl/inv*100).toFixed(2):'0.00'}%)</b></span><br>${t('tgt')}: <b>$${f(tg)}</b> | ${t('stp')}: <b>$${f(sl)}</b>${real?`<br>${t('real')}: <b class="${real>=0?'up':'dn'}">${real>=0?'+':''}${real.toFixed(2)}$</b>`:''}<div class="act ${ac}" style="margin:6px 0 0">${A}</div></div>`}
return`<div class="card ${sg=='buy'?'gb':sg=='sell'?'gs':''}"><div class="h"><b>${c.s} / USDT</b><a href="https://www.binance.com/en/trade/${c.s}_USDT?type=spot" target="_blank" rel="noopener">${t('binance')}</a><button class="sm" style="background:none;color:var(--m)" onclick="rm('${c.s}')">✕</button></div><div><span class="p">$${f(p)}</span></div>
${a?`<div class="act ${sg} ${sg!='hold'&&Math.abs(a.sc)>=4?'blink':''}">${t(sg=='buy'?'buy':sg=='sell'?'sell':'wait')}</div>`:''}
